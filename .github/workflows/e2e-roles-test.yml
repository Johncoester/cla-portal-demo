# Role smoke against CLA Portal Live Test only.
# Runs after a successful GitHub Pages deploy, every night at 2:00 America/New_York,
# and when someone starts it by hand. It never receives a production URL.
name: e2e-roles-test

on:
  workflow_dispatch:
    inputs:
      seed_accounts:
        description: Create the E2E auth users on TEST from repo secrets
        type: boolean
        default: false
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  schedule:
    # 2:00 AM Eastern Daylight Time and 2:00 AM Eastern Standard Time.
    # The job continues only when the clock in America/New_York says 02.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'

permissions:
  contents: read

# One suite at a time. A later run waits, so two browsers never share TEST's 20 PostgREST connections.
concurrency:
  group: e2e-roles-test
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    # ubuntu-latest is 26.04. Playwright 1.58.2 cannot install Chromium there.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_TARGET: test
      E2E_BASE_URL: https://testportal.clatitle.com/
      E2E_REQUIRE_EMAIL: '1'
      E2E_MAIL_TO: ${{ secrets.E2E_MAIL_TO }}
      # Optional. When these are empty, the email test reads them from TEST Vault
      # with SUPABASE_SERVICE_ROLE_KEY. The step does not print the values.
      E2E_GMAIL_CLIENT_ID: ${{ secrets.E2E_GMAIL_CLIENT_ID }}
      E2E_GMAIL_CLIENT_SECRET: ${{ secrets.E2E_GMAIL_CLIENT_SECRET }}
      E2E_GMAIL_REFRESH_TOKEN: ${{ secrets.E2E_GMAIL_REFRESH_TOKEN }}
      E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
      E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
      E2E_PROCESSOR_EMAIL: ${{ secrets.E2E_PROCESSOR_EMAIL }}
      E2E_PROCESSOR_PASSWORD: ${{ secrets.E2E_PROCESSOR_PASSWORD }}
      E2E_SALES_PERSON_EMAIL: ${{ secrets.E2E_SALES_PERSON_EMAIL }}
      E2E_SALES_PERSON_PASSWORD: ${{ secrets.E2E_SALES_PERSON_PASSWORD }}
      E2E_SALES_TEAM_EMAIL: ${{ secrets.E2E_SALES_TEAM_EMAIL }}
      E2E_SALES_TEAM_PASSWORD: ${{ secrets.E2E_SALES_TEAM_PASSWORD }}
      E2E_TRANSACTION_COORDINATOR_EMAIL: ${{ secrets.E2E_TRANSACTION_COORDINATOR_EMAIL }}
      E2E_TRANSACTION_COORDINATOR_PASSWORD: ${{ secrets.E2E_TRANSACTION_COORDINATOR_PASSWORD }}
      E2E_BUYER_AGENT_EMAIL: ${{ secrets.E2E_BUYER_AGENT_EMAIL }}
      E2E_BUYER_AGENT_PASSWORD: ${{ secrets.E2E_BUYER_AGENT_PASSWORD }}
      E2E_LISTING_AGENT_EMAIL: ${{ secrets.E2E_LISTING_AGENT_EMAIL }}
      E2E_LISTING_AGENT_PASSWORD: ${{ secrets.E2E_LISTING_AGENT_PASSWORD }}
      E2E_CLIENT_BUYER_EMAIL: ${{ secrets.E2E_CLIENT_BUYER_EMAIL }}
      E2E_CLIENT_BUYER_PASSWORD: ${{ secrets.E2E_CLIENT_BUYER_PASSWORD }}
      E2E_CLIENT_SELLER_EMAIL: ${{ secrets.E2E_CLIENT_SELLER_EMAIL }}
      E2E_CLIENT_SELLER_PASSWORD: ${{ secrets.E2E_CLIENT_SELLER_PASSWORD }}
    steps:
      - name: Stay on the 2 AM Eastern run
        if: github.event_name == 'schedule'
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "$hour" != "02" ]; then
            echo "Clock in America/New_York is ${hour}, not 02. This cron slot is the other daylight-saving hour."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        id: clock

      # Bob, Nov 10: a burst of merges queued one full run per deploy, back to back on TEST (7:53-8:43 ET), and the
      # task queries slowed for everyone. A deploy run whose commit is no longer the tip of main skips: the newer
      # deploy brings its own run. The nightly and hand-started runs always go.
      - name: Skip a deploy run that a newer commit replaced
        if: github.event_name == 'workflow_run'
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ -n "$tip" ] && [ "$tip" != "$RUN_SHA" ]; then
            echo "main is at ${tip}, this deploy was ${RUN_SHA}. The newer deploy runs the smoke."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.clock.outputs.skip != '1' && steps.fresh.outputs.skip != '1'
        uses: actions/checkout@v4

      - name: Refuse any target except TEST
        if: steps.clock.outputs.skip != '1' && steps.fresh.outputs.skip != '1'
        run: |
          python3 - <<'PY'
          import os, sys
          url = os.environ['E2E_BASE_URL']
          if os.environ.get('E2E_TARGET') != 'test':
              sys.exit('E2E_TARGET must be test')
          if url.rstrip('/') != 'https://testportal.clatitle.com':
              sys.exit('Refusing to run. The base URL is not the TEST portal.')
          print('target ok')
          PY

      - name: Setup Node
        if: steps.clock.outputs.skip != '1' && steps.fresh.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        if: steps.clock.outputs.skip != '1' && steps.fresh.outputs.skip != '1'
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install --with-deps chromium

      - name: Seed TEST accounts
        if: steps.clock.outputs.skip != '1' && steps.fresh.outputs.skip != '1' && github.event_name == 'workflow_dispatch' && github.event.inputs.seed_accounts == 'true'
        env:
          E2E_TARGET: test
          SUPABASE_URL: https://aqcervntopidtcazcmlv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tests/e2e-roles/seed-accounts.mjs --workflow-dispatch

      - name: Role smoke
        if: steps.clock.outputs.skip != '1' && steps.fresh.outputs.skip != '1'
        env:
          SUPABASE_URL: https://aqcervntopidtcazcmlv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx playwright test --config tests/e2e-roles/playwright.config.js

      # Rows a run creates (uploads, E2E-RUN threads and orders, their task copies) are deleted again, pass or fail.
      # A cleanup problem shows in the log and the summary, and does not turn a passing smoke red.
      - name: Remove this run's rows from TEST
        if: always() && steps.clock.outputs.skip != '1' && steps.fresh.outputs.skip != '1'
        continue-on-error: true
        env:
          SUPABASE_URL: https://aqcervntopidtcazcmlv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          node tests/e2e-roles/cleanup-runs.mjs --workflow 2>&1 | tee cleanup.log
          status=${PIPESTATUS[0]}
          { echo; echo "**TEST cleanup**"; echo; sed 's/^/    /' cleanup.log; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Pass or fail summary
        if: always() && steps.clock.outputs.skip != '1' && steps.fresh.outputs.skip != '1'
        run: |
          if [ -f tests/e2e-roles/test-results/summary.md ]; then
            cat tests/e2e-roles/test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary file. The suite did not finish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Screenshots and trace
        if: failure() && steps.clock.outputs.skip != '1' && steps.fresh.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-roles-failure
          path: |
            tests/e2e-roles/test-results
            tests/e2e-roles/playwright-report
          if-no-files-found: ignore
