# Merge checks (Bob, Nov 10). Every pull request into main, and every merge-queue batch, must pass all three jobs.
# Nov 10: a stamp-conflict merge dropped an import from js/app.js and every file page hung on TEST.
#  - imports:   a name used but not defined or imported (ESLint no-undef), and every module linking (missing exports or paths)
#  - tests:     test/test-*.js and test/test-*.sh; fails only on a test that passes on main and fails with this change
#  - smoke:     headless Chromium on the mock data, one person per role, dashboard and every tab of a file
# To make them block merges: Settings > Branches > main > require these status checks (and a merge queue).
name: pr-checks

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ESLint
        run: npm install --no-save eslint@9.17.0 globals@15.14.0
      - name: Names used but not defined or imported
        run: npx eslint js
      - name: Every module links
        run: node --import ./test/register-supabase-fake.mjs tools/check-module-links.mjs

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test-money-save reads an older commit with git show
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: linkedom where the DOM tests expect it
        run: |
          mkdir -p /tmp/domtest
          npm install --prefix /tmp/domtest --no-save linkedom@0.18.15
      - name: Postgres 16 (runner) and 17 for the SQL tests
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
          sudo systemctl start postgresql.service
          # the sudo -u postgres tests read SQL files from the checkout
          chmod a+x /home/runner /home/runner/work
          chmod -R a+rX "$GITHUB_WORKSPACE"
      - name: Test suite (fails only on a test that passes on main)
        run: node tools/run-tests.mjs

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: '1.58.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Nov 11: smoke failed at "Install Playwright" with "Temporary failure resolving azure.archive.ubuntu.com".
      # The Chromium download is cached by Playwright version, apt retries on its own, and the system-package
      # step is tried 4 times. If the mirror is still unreachable, the job goes on with the runner's own packages
      # (ubuntu-24.04 already has what headless Chromium needs) and the smoke itself decides pass or fail.
      - name: Install Playwright
        run: npm install --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-ubuntu-24.04-${{ env.PLAYWRIGHT_VERSION }}
      - name: Download Chromium (cache miss only, with retry)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4; do
            npx playwright install chromium && exit 0
            echo "Chromium download attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1
      - name: Chromium system packages (with retry)
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          for i in 1 2 3 4; do
            npx playwright install-deps chromium && exit 0
            echo "install-deps attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          echo "::warning::apt mirror unreachable after 4 tries; using the runner's preinstalled packages"
          exit 0
      - name: Every role, dashboard and file tabs, mock data
        run: node tools/smoke-mock.mjs
